# One-click deploy on Render: New + -> Blueprint -> pick your GitHub repo.
services:
  - type: web
    name: college-website
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: College Website
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: SEED_DB
        value: "true"   # set to "false" after the first successful deploy
